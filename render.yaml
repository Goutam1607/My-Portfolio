# Render Blueprint: deploys this portfolio as a free Render "Static Site".
# In Render: New + → Blueprint → pick this repository → Apply.
services:
  - type: web
    runtime: static
    name: my-portfolio
    # Install exact versions from package-lock.json, then build the site into ./out
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    # Redeploy automatically on every push to GitHub
    autoDeployTrigger: commit
    headers:
      # Next.js build files have unique names, so browsers can cache them "forever"
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
